<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet DJ</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: 0.7rem 1.2rem; margin: 0.3rem 0; font-size: 1rem; cursor: pointer; display: block; }
    #adres { word-break: break-all; font-family: monospace; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ccc; }
    td.sayi { text-align: right; font-family: monospace; }
    .kucuk { font-size: 0.8rem; color: #777; }
  </style>
</head>
<body>
  <h1>Wallet DJ</h1>

  <div id="cuzdanlar"></div>
  <p id="durum">Cüzdanlar aranıyor...</p>
  <p id="adres"></p>
  <button id="yenile" style="display:none">Bakiyeleri yenile</button>
  <button id="kes" style="display:none">Bağlantıyı kes</button>
  <div id="bakiyeler"></div>

  <script>
    // ---------- AYARLAR ----------
    // Solana ağına soru sorduğumuz kapı (RPC). Sorun olursa burayı değiştiririz.
    const RPC_ADRESI = "https://mainnet.helius-rpc.com/?api-key=8e2fd160-d29c-452f-bfd5-507192363a1f";

    // İki token programı: eski ve yeni standart
    const TOKEN_PROGRAMLARI = [
      "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
      "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
    ];

    // Bildiğimiz bazı tokenlar: mint adresi -> kısa ad
    const BILINEN = {
      "So11111111111111111111111111111111111111112": "wSOL",
      "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v": "USDC",
      "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB": "USDT",
      "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN": "JUP",
      "jupSoLaHXQiZZTSfEWMTRRgpnyFm8f6sZdosWBjx93v": "JupSOL",
      "mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So": "mSOL",
      "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263": "BONK"
    };

    // ---------- CÜZDAN BULMA (önceki adımla aynı) ----------
    const bulunanCuzdanlar = [];
    let aktifAdres = null;
    let aktifCuzdan = null;

    function cuzdanEkle(cuzdan) {
      const solanaMi = cuzdan.chains.some(function (z) { return z.startsWith("solana:"); });
      if (!solanaMi) return;
      if (bulunanCuzdanlar.includes(cuzdan)) return;
      bulunanCuzdanlar.push(cuzdan);
      listeyiCiz();
    }

    const kapi = {
      register: function (...cuzdanlar) { cuzdanlar.forEach(cuzdanEkle); return function () {}; }
    };
    window.addEventListener("wallet-standard:register-wallet", function (olay) { olay.detail(kapi); });
    window.dispatchEvent(new CustomEvent("wallet-standard:app-ready", { detail: kapi }));

    function listeyiCiz() {
      const alan = document.getElementById("cuzdanlar");
      alan.innerHTML = "";
      document.getElementById("durum").textContent = "Bağlanmak için bir cüzdan seç:";
      bulunanCuzdanlar.forEach(function (cuzdan) {
        const dugme = document.createElement("button");
        dugme.textContent = cuzdan.name + " ile bağlan";
        dugme.onclick = function () { baglan(cuzdan); };
        alan.appendChild(dugme);
      });
    }

    async function baglan(cuzdan) {
      const durum = document.getElementById("durum");
      try {
        durum.textContent = "Cüzdanında onay ekranı açılmalı...";
        const sonuc = await cuzdan.features["standard:connect"].connect();
        aktifAdres = sonuc.accounts[0].address;
        durum.textContent = cuzdan.name + " bağlandı. Adresin:";
        document.getElementById("adres").textContent = aktifAdres;
        document.getElementById("yenile").style.display = "block";
        document.getElementById("kes").style.display = "block";
        aktifCuzdan = cuzdan;
      
        bakiyeleriGetir();
      } catch (hata) {
        durum.textContent = "Bağlantı olmadı: " + hata.message;
      }
    }

    setTimeout(function () {
      if (bulunanCuzdanlar.length === 0) {
        document.getElementById("durum").textContent =
          "Hiç cüzdan bulunamadı. Tarayıcında cüzdan eklentisi kurulu mu?";
      }
    }, 2000);

    // ---------- YENİ: RPC İLE SORU SORMA ----------
    // Bu fonksiyon RPC'ye tek bir soru sorar ve cevabı getirir.
    async function rpcSor(yontem, parametreler) {
      const cevap = await fetch(RPC_ADRESI, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: yontem, params: parametreler })
      });
      if (!cevap.ok) throw new Error("RPC cevap vermedi (kod " + cevap.status + ")");
      const veri = await cevap.json();
      if (veri.error) throw new Error(veri.error.message);
      return veri.result;
    }

    async function bakiyeleriGetir() {
      const alan = document.getElementById("bakiyeler");
      alan.textContent = "Bakiyeler yükleniyor...";
      try {
        // Soru 1: SOL bakiyesi (lamport cinsinden, 1 SOL = 1 milyar lamport)
        const solSonuc = await rpcSor("getBalance", [aktifAdres]);
        const solMiktar = solSonuc.value / 1000000000;

        // Soru 2 ve 3: Her iki programdaki token hesapları
        const satirlar = [];
        for (const program of TOKEN_PROGRAMLARI) {
          const sonuc = await rpcSor("getTokenAccountsByOwner", [
            aktifAdres,
            { programId: program },
            { encoding: "jsonParsed" }
          ]);
          sonuc.value.forEach(function (hesap) {
            const bilgi = hesap.account.data.parsed.info;
            const miktar = bilgi.tokenAmount;
            if (Number(miktar.uiAmountString) > 0) {
              satirlar.push({ mint: bilgi.mint, miktar: miktar.uiAmountString });
            }
          });
        }
        tabloyuCiz(solMiktar, satirlar);
      } catch (hata) {
        alan.textContent = "Bakiyeler alınamadı: " + hata.message;
      }
    }

    function tabloyuCiz(solMiktar, tokenlar) {
      const alan = document.getElementById("bakiyeler");
      alan.innerHTML = "";
      const tablo = document.createElement("table");

      function satirEkle(ad, mint, miktar) {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        td1.textContent = ad;
        if (mint) {
          const alt = document.createElement("div");
          alt.className = "kucuk";
          alt.textContent = mint.slice(0, 4) + "..." + mint.slice(-4);
          td1.appendChild(alt);
        }
        const td2 = document.createElement("td");
        td2.className = "sayi";
        td2.textContent = miktar;
        tr.appendChild(td1);
        tr.appendChild(td2);
        tablo.appendChild(tr);
      }

      satirEkle("SOL", null, solMiktar.toString());
      tokenlar.forEach(function (t) {
        satirEkle(BILINEN[t.mint] || "Bilinmeyen token", t.mint, t.miktar);
      });

      alan.appendChild(tablo);
    }

        document.getElementById("yenile").onclick = bakiyeleriGetir;

    document.getElementById("kes").onclick = async function () {
      try {
        // Cüzdan "bağlantıyı kes" özelliğini destekliyorsa ona haber ver
        const ozellik = aktifCuzdan && aktifCuzdan.features["standard:disconnect"];
        if (ozellik) await ozellik.disconnect();
      } catch (hata) {
        // Cüzdan bu özelliği desteklemese de sayfayı temizlemeye devam ederiz
      }
      aktifAdres = null;
      aktifCuzdan = null;
      document.getElementById("adres").textContent = "";
      document.getElementById("bakiyeler").innerHTML = "";
      document.getElementById("yenile").style.display = "none";
      document.getElementById("kes").style.display = "none";
      document.getElementById("durum").textContent =
        "Bağlantı kesildi. Tekrar bağlanmak için bir cüzdan seç:";
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet DJ</title>
  <style>
    :root { --bg:#0e1116; --kart:#171c24; --cizgi:#262d38; --yazi:#e8ecf1; --soluk:#8b95a5; --vurgu:#7c5cff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--yazi); line-height:1.4;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kap { max-width: 960px; margin: 0 auto; padding: 1rem; }
    header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
    h1 { font-size:1.4rem; margin:0; }
    h2 { font-size:1rem; margin:0 0 .8rem; color:var(--soluk); font-weight:600; }
    .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:14px; padding:1rem; }
    .btn { background:var(--vurgu); color:#fff; border:0; border-radius:10px; padding:.7rem 1rem; font-size:1rem; cursor:pointer; }
    .btn.ikincil { background:var(--cizgi); }
    .btn.tam { width:100%; margin:.3rem 0; text-align:left; }
    .aksiyon { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .adres { font-family:monospace; color:var(--soluk); font-size:.9rem; }
    .istatistikler { display:grid; grid-template-columns:1fr; gap:.8rem; margin-bottom:1rem; }
    .istatistik .etiket { color:var(--soluk); font-size:.85rem; }
    .istatistik .deger { font-size:1.6rem; font-weight:700; margin-top:.2rem; }
    .istatistik .alt { color:var(--soluk); font-size:.85rem; }
    .izgara { display:grid; grid-template-columns:1fr; gap:1rem; }
    @media (min-width:720px) {
      .istatistikler { grid-template-columns:repeat(3,1fr); }
      .izgara { grid-template-columns:1fr 1fr; }
    }
    .pasta { width:100%; max-width:260px; display:block; margin:0 auto; }
    .gosterge { list-style:none; padding:0; margin:1rem 0 0; }
    .gosterge li { display:flex; align-items:center; gap:.5rem; padding:.25rem 0; font-size:.95rem; }
    .nokta { width:.8rem; height:.8rem; border-radius:50%; flex:none; }
    .gosterge .ad { flex:1; }
    .gosterge .yuzde { color:var(--soluk); }
    table { width:100%; border-collapse:collapse; }
    td { padding:.55rem .2rem; border-bottom:1px solid var(--cizgi); vertical-align:top; }
    td.sag { text-align:right; font-variant-numeric:tabular-nums; }
    .kucuk { font-size:.78rem; color:var(--soluk); }
    details { margin-top:1rem; }
    summary { cursor:pointer; color:var(--soluk); }
    .gizli { display:none; }
    .mesaj { color:var(--soluk); padding:.5rem 0; }
  </style>
</head>
<body>
<div class="kap">
  <header>
    <h1>Wallet DJ</h1>
    <div id="ust-aksiyon" class="aksiyon gizli">
      <span id="adres-etiketi" class="adres"></span>
      <button id="yenile" class="btn ikincil">Yenile</button>
      <button id="kes" class="btn ikincil">Bağlantıyı kes</button>
    </div>
  </header>

  <div id="baglanti-karti" class="kart">
    <h2>Cüzdan bağla</h2>
    <p id="durum" class="mesaj">Cüzdanlar aranıyor...</p>
    <div id="cuzdanlar"></div>
  </div>

  <div id="pano" class="gizli">
    <p id="pano-durum" class="mesaj"></p>
    <div class="istatistikler">
      <div class="kart istatistik"><div class="etiket">Toplam değer</div><div id="st-toplam" class="deger">-</div><div class="alt">Sadece fiyatı bilinenler</div></div>
      <div class="kart istatistik"><div class="etiket">SOL</div><div id="st-sol" class="deger">-</div><div id="st-sol-alt" class="alt"></div></div>
      <div class="kart istatistik"><div class="etiket">Token sayısı</div><div id="st-token" class="deger">-</div><div id="st-token-alt" class="alt"></div></div>
    </div>
    <div class="izgara">
      <div class="kart"><h2>Dağılım (USD)</h2><div id="pasta-alan"></div><ul id="gosterge" class="gosterge"></ul></div>
      <div class="kart"><h2>Varlıklar</h2><table id="tablo"></table>
        <details id="fiyatsiz-kutu" class="gizli"><summary id="fiyatsiz-baslik"></summary><table id="fiyatsiz-tablo"></table></details>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- AYARLAR ----------
  const RPC_ADRESI = "https://mainnet.helius-rpc.com/?api-key=8e2fd160-d29c-452f-bfd5-507192363a1f";
  const JUP_ADRES = "https://api.jup.ag";

  const SOL_MINT = "So11111111111111111111111111111111111111112";
  const JUP_MINT = "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN";
  const TOKEN_PROGRAMLARI = [
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
  ];
  // Jupiter ad veremezse kullanılacak yedek isimler
  const BILINEN = {
    "So11111111111111111111111111111111111111112": "wSOL",
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v": "USDC",
    "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB": "USDT",
    "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN": "JUP",
    "jupSoLaHXQiZZTSfEWMTRRgpnyFm8f6sZdosWBjx93v": "JupSOL",
    "mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So": "mSOL",
    "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263": "BONK"
  };
  const RENKLER = ["#7c5cff", "#19c37d", "#f5a524", "#ef5da8", "#3ea6ff", "#ff6b4a", "#2ed3c6"];
  const DIGER_RENK = "#8b95a5";
  const EN_FAZLA_DILIM = 7;

  // ---------- KÜÇÜK YARDIMCILAR ----------
  const $ = function (id) { return document.getElementById(id); };
  const usd = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "USD" });
  const usdKisa = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const sayi = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 6 });
  function fiyatYaz(p) {
    return new Intl.NumberFormat("tr-TR", {
      style: "currency", currency: "USD",
      minimumFractionDigits: 2, maximumFractionDigits: p < 1 ? 6 : 2
    }).format(p);
  }
  function kisalt(a) { return a.slice(0, 4) + "..." + a.slice(-4); }
  function parcala(liste, boyut) {
    const sonuc = [];
    for (let i = 0; i < liste.length; i += boyut) sonuc.push(liste.slice(i, i + boyut));
    return sonuc;
  }
  function goster(id, acik) { $(id).classList.toggle("gizli", !acik); }

  // ---------- CÜZDAN BULMA VE BAĞLANMA ----------
  const bulunanCuzdanlar = [];
  let aktifAdres = null;
  let aktifCuzdan = null;

  function cuzdanEkle(cuzdan) {
    const solanaMi = cuzdan.chains.some(function (z) { return z.startsWith("solana:"); });
    if (!solanaMi || bulunanCuzdanlar.includes(cuzdan)) return;
    bulunanCuzdanlar.push(cuzdan);
    listeyiCiz();
  }
  const kapi = {
    register: function (...cuzdanlar) { cuzdanlar.forEach(cuzdanEkle); return function () {}; }
  };
  window.addEventListener("wallet-standard:register-wallet", function (olay) { olay.detail(kapi); });
  window.dispatchEvent(new CustomEvent("wallet-standard:app-ready", { detail: kapi }));

  function listeyiCiz() {
    const alan = $("cuzdanlar");
    alan.innerHTML = "";
    $("durum").textContent = "Bağlanmak için bir cüzdan seç:";
    bulunanCuzdanlar.forEach(function (cuzdan) {
      const dugme = document.createElement("button");
      dugme.className = "btn tam";
      dugme.textContent = cuzdan.name + " ile bağlan";
      dugme.onclick = function () { baglan(cuzdan); };
      alan.appendChild(dugme);
    });
  }

  async function baglan(cuzdan) {
    try {
      $("durum").textContent = "Cüzdanında onay ekranı açılmalı...";
      const sonuc = await cuzdan.features["standard:connect"].connect();
      aktifAdres = sonuc.accounts[0].address;
      aktifCuzdan = cuzdan;
      $("adres-etiketi").textContent = cuzdan.name + " · " + kisalt(aktifAdres);
      goster("baglanti-karti", false);
      goster("ust-aksiyon", true);
      goster("pano", true);
      bakiyeleriGetir();
    } catch (hata) {
      $("durum").textContent = "Bağlantı olmadı: " + hata.message;
    }
  }

  setTimeout(function () {
    if (bulunanCuzdanlar.length === 0) {
      $("durum").textContent = "Hiç cüzdan bulunamadı. Tarayıcında cüzdan eklentisi kurulu mu?";
    }
  }, 2000);

  $("kes").onclick = async function () {
    try {
      const ozellik = aktifCuzdan && aktifCuzdan.features["standard:disconnect"];
      if (ozellik) await ozellik.disconnect();
    } catch (hata) { /* cüzdan desteklemese de temizlemeye devam */ }
    aktifAdres = null;
    aktifCuzdan = null;
    goster("pano", false);
    goster("ust-aksiyon", false);
    goster("baglanti-karti", true);
    $("durum").textContent = "Bağlantı kesildi. Tekrar bağlanmak için bir cüzdan seç:";
  };
  $("yenile").onclick = function () { bakiyeleriGetir(); };

  // ---------- VERİ ÇEKME ----------
  async function rpcSor(yontem, parametreler) {
    const cevap = await fetch(RPC_ADRESI, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: yontem, params: parametreler })
    });
    if (!cevap.ok) throw new Error("RPC cevap vermedi (kod " + cevap.status + ")");
    const veri = await cevap.json();
    if (veri.error) throw new Error(veri.error.message);
    return veri.result;
  }

  async function fiyatlariGetir(mintler) {
    const sonuc = {};
    for (const parca of parcala(mintler, 50)) {
      const r = await fetch(JUP_ADRES + "/price/v3?ids=" + parca.join(","));
      if (!r.ok) throw new Error("Jupiter fiyat servisi cevap vermedi (kod " + r.status + ")");
      Object.assign(sonuc, await r.json());
    }
    return sonuc;
  }

  // Token adları. Başarısız olursa sessizce boş döner, yedek isimler kullanılır.
  async function adlariGetir(mintler) {
    const sonuc = {};
    try {
      for (const parca of parcala(mintler, 100)) {
        const r = await fetch(JUP_ADRES + "/tokens/v2/search?query=" + parca.join(","));
        if (!r.ok) continue;
        const liste = await r.json();
        if (Array.isArray(liste)) {
          liste.forEach(function (t) { if (t && t.id) sonuc[t.id] = t; });
        }
      }
    } catch (hata) { /* ad alınamazsa yedek isimler kullanılacak */ }
    return sonuc;
  }

  // Jupiter'e stake edilmiş JUP. Başarısız olursa null döner, sayfa bozulmaz.
  async function stakeJupGetir(adres) {
    try {
      const r = await fetch(JUP_ADRES + "/portfolio/v1/staked-jup/" + adres);
      if (!r.ok) return null;
      return await r.json();
    } catch (hata) { return null; }
  }

  async function bakiyeleriGetir() {
    const durum = $("pano-durum");
    if (RPC_ADRESI.startsWith("BURAYA")) {
      durum.textContent = "Dosyanın başındaki RPC_ADRESI satırını doldurman gerekiyor.";
      return;
    }
    durum.textContent = "Bakiyeler yükleniyor...";
    try {
      // 1) Zincirden miktarlar
      const sol = await rpcSor("getBalance", [aktifAdres]);
      const toplamlar = {};
      for (const program of TOKEN_PROGRAMLARI) {
        const sonuc = await rpcSor("getTokenAccountsByOwner", [
          aktifAdres, { programId: program }, { encoding: "jsonParsed" }
        ]);
        sonuc.value.forEach(function (hesap) {
          const bilgi = hesap.account.data.parsed.info;
          const miktar = Number(bilgi.tokenAmount.uiAmountString);
          if (miktar > 0) toplamlar[bilgi.mint] = (toplamlar[bilgi.mint] || 0) + miktar;
        });
      }
      const satirlar = [{ mint: SOL_MINT, ad: "SOL", sabitAd: true, yerel: true, miktar: sol.value / 1e9, usd: null, fiyat: null }];
      Object.keys(toplamlar).forEach(function (mint) {
        satirlar.push({ mint: mint, ad: null, miktar: toplamlar[mint], usd: null, fiyat: null });
      });

      // 2) Stake edilmiş JUP (varsa ayrı satırlar olarak eklenir)
      const stake = await stakeJupGetir(aktifAdres);
      if (stake) {
        if (stake.stakedAmount > 0) {
          satirlar.push({ mint: JUP_MINT, ad: "JUP (stake)", sabitAd: true, stake: true, miktar: stake.stakedAmount, usd: null, fiyat: null });
        }
        const cozulen = (stake.unstaking || []).reduce(function (t, u) { return t + (u.amount || 0); }, 0);
        if (cozulen > 0) {
          satirlar.push({ mint: JUP_MINT, ad: "JUP (çözülüyor)", sabitAd: true, stake: true, miktar: cozulen, usd: null, fiyat: null });
        }
      }

      // 3) Jupiter'den fiyatlar
      let fiyatHatasi = null;
      try {
        const mintler = Array.from(new Set(satirlar.map(function (s) { return s.mint; })));
        const fiyatlar = await fiyatlariGetir(mintler);
        satirlar.forEach(function (s) {
          const f = fiyatlar[s.mint];
          if (f && typeof f.usdPrice === "number") {
            s.fiyat = f.usdPrice;
            s.usd = s.miktar * f.usdPrice;
          }
        });
      } catch (hata) { fiyatHatasi = hata.message; }

      // 4) Fiyatı olanların adları
      const fiyatliMintler = Array.from(new Set(
        satirlar.filter(function (s) { return s.usd !== null; }).map(function (s) { return s.mint; })
      ));
      const adlar = await adlariGetir(fiyatliMintler);
      satirlar.forEach(function (s) {
        if (s.sabitAd) return;
        const meta = adlar[s.mint];
        s.ad = (meta && meta.symbol ? String(meta.symbol).slice(0, 20) : null) || BILINEN[s.mint] || null;
      });

      panoyuCiz(satirlar, fiyatHatasi);
    } catch (hata) {
      durum.textContent = "Bakiyeler alınamadı: " + hata.message;
    }
  }

  // ---------- EKRANA ÇİZME ----------
  function panoyuCiz(satirlar, fiyatHatasi) {
    $("pano-durum").textContent = fiyatHatasi
      ? "Fiyatlar alınamadı (" + fiyatHatasi + "). Sadece miktarlar gösteriliyor."
      : "";

    const fiyatli = satirlar.filter(function (s) { return s.usd !== null; })
                            .sort(function (a, b) { return b.usd - a.usd; });
    const fiyatsiz = satirlar.filter(function (s) { return s.usd === null; });
    const toplam = fiyatli.reduce(function (t, s) { return t + s.usd; }, 0);
    const solSatiri = satirlar[0];

    $("st-toplam").textContent = fiyatli.length ? usd.format(toplam) : "-";
    $("st-sol").textContent = sayi.format(solSatiri.miktar);
    $("st-sol-alt").textContent = solSatiri.usd !== null ? usd.format(solSatiri.usd) : "Fiyat yok";

    // Token sayısına SOL ve stake satırları dahil değil
    const tokenlar = satirlar.filter(function (s) { return !s.yerel && !s.stake; });
    const tokenFiyatli = tokenlar.filter(function (s) { return s.usd !== null; }).length;
    $("st-token").textContent = String(tokenlar.length);
    $("st-token-alt").textContent = tokenFiyatli + " fiyatlı, " + (tokenlar.length - tokenFiyatli) + " fiyatsız";

    // Pasta dilimleri: en büyük dilimler + "Diğer"
    const dilimler = fiyatli.slice(0, EN_FAZLA_DILIM).map(function (s, i) {
      return { ad: adGoster(s), deger: s.usd, renk: RENKLER[i % RENKLER.length] };
    });
    const digerDeger = fiyatli.slice(EN_FAZLA_DILIM).reduce(function (t, s) { return t + s.usd; }, 0);
    if (digerDeger > 0) dilimler.push({ ad: "Diğer", deger: digerDeger, renk: DIGER_RENK });
    pastaCiz(dilimler, toplam);

    // Tablo
    tabloDoldur($("tablo"), fiyatli, true);
    if (fiyatsiz.length) {
      goster("fiyatsiz-kutu", true);
      $("fiyatsiz-baslik").textContent = "Fiyatı bulunamayan " + fiyatsiz.length + " satır (pastaya dahil değil)";
      tabloDoldur($("fiyatsiz-tablo"), fiyatsiz, false);
    } else {
      goster("fiyatsiz-kutu", false);
    }
  }

  function adGoster(s) { return s.ad || "Bilinmeyen"; }

  function tabloDoldur(tablo, satirlar, degerliMi) {
    tablo.innerHTML = "";
    satirlar.forEach(function (s) {
      const tr = document.createElement("tr");

      const td1 = document.createElement("td");
      td1.textContent = adGoster(s);
      const alt1 = document.createElement("div");
      alt1.className = "kucuk";
      alt1.textContent = kisalt(s.mint);
      td1.appendChild(alt1);

      const td2 = document.createElement("td");
      td2.className = "sag";
      td2.textContent = degerliMi ? usd.format(s.usd) : sayi.format(s.miktar);
      const alt2 = document.createElement("div");
      alt2.className = "kucuk";
      alt2.textContent = degerliMi
        ? sayi.format(s.miktar) + " × " + fiyatYaz(s.fiyat)
        : "Fiyat yok";
      td2.appendChild(alt2);

      tr.appendChild(td1);
      tr.appendChild(td2);
      tablo.appendChild(tr);
    });
  }

  function pastaCiz(dilimler, toplam) {
    const alan = $("pasta-alan");
    const liste = $("gosterge");
    alan.innerHTML = "";
    liste.innerHTML = "";
    if (!dilimler.length || toplam <= 0) {
      alan.textContent = "Fiyatı bilinen varlık yok, grafik çizilemedi.";
      alan.className = "mesaj";
      return;
    }
    alan.className = "";
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 42 42");
    svg.setAttribute("class", "pasta");

    function daire(renk) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", "21");
      c.setAttribute("cy", "21");
      c.setAttribute("r", "15.9155");   // çevresi tam 100 birim, yüzde hesabı kolaylaşır
      c.setAttribute("fill", "none");
      c.setAttribute("stroke", renk);
      c.setAttribute("stroke-width", "6");
      return c;
    }
    svg.appendChild(daire("#262d38"));

    let birikmis = 0;
    dilimler.forEach(function (d) {
      const yuzde = d.deger / toplam * 100;
      const c = daire(d.renk);
      c.setAttribute("stroke-dasharray", yuzde + " " + (100 - yuzde));
      c.setAttribute("stroke-dashoffset", String(25 - birikmis));  // 25: 12 yönünden başlat
      svg.appendChild(c);
      birikmis += yuzde;

      const li = document.createElement("li");
      const nokta = document.createElement("span");
      nokta.className = "nokta";
      nokta.style.background = d.renk;
      const ad = document.createElement("span");
      ad.className = "ad";
      ad.textContent = d.ad;
      const y = document.createElement("span");
      y.className = "yuzde";
      y.textContent = yuzde.toFixed(1).replace(".", ",") + "% · " + usd.format(d.deger);
      li.appendChild(nokta); li.appendChild(ad); li.appendChild(y);
      liste.appendChild(li);
    });

    function yazi(metin, y, boyut, renk) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", "21");
      t.setAttribute("y", String(y));
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-size", String(boyut));
      t.setAttribute("fill", renk);
      t.textContent = metin;
      return t;
    }
    svg.appendChild(yazi("Toplam", 19.5, 2.6, "#8b95a5"));
    svg.appendChild(yazi(usdKisa.format(toplam), 24, 3.6, "#e8ecf1"));
    alan.appendChild(svg);
  }
</script>
</body>
</html>
